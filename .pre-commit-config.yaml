repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: elm-format
        name: elm-format
        language: node
        language_version: 26.5.1
        additional_dependencies: [elm-format@0.8.8]
        entry: elm-format --yes
        files: \.elm$
