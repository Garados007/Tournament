<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tournament</title>
</head>
<body>
  <script src="/index.js"></script>
  <script src="/js/local-storage.js"></script>
  <script src="/js/websocket.js"></script>
  <script>
      var relay = ["localhost", "127.0.0.1"].includes(location.hostname)
          ? "http://localhost:8005"
          : "https://relay.2complex.de";
      // Browser.application renders into body, so no node is needed
      var app = Elm.Main.init({ flags: { relay: relay } });
      new ElmWebSocketPorts().subscribe(app, "sendSocketCommand", "receiveSocketMsg", "receiveSocketClose");
      new ElmLocalStoragePorts().subscribe(app, "settingGetItem", "settingSetItem", "settingClear", "settingListKeys", "settingResponse");
  </script>
</body>
</html>
